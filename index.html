<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sınıf Listem</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4ff;
  margin: 0;
  padding: 20px;
  color: #24304a;
}
.kutu {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #ccd3e5;
}
h1 { text-align: center; color: #4255a4; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 8px;
  border: 1px solid #ccd3e5;
  font-size: 16px;
}
button {
  background: #5969d9;
  color: white;
  border: none;
}
li {
  background: #f3f5ff;
  margin: 8px 0;
  padding: 10px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}
li button { width: auto; float: right; padding: 6px 10px; }
#sayac { text-align: center; color: #5969d9; }
</style>
</head>
<body>
<div class="kutu">
  <h1>📚 Sınıf Listem</h1>

  <input id="sinif" placeholder="Sınıf adı (ör. 7-A)">

  <input id="isim" placeholder="Öğrenci adını yaz">
  <button onclick="ekle()">➕ Öğrenci Ekle</button>

  <input id="arama" placeholder="🔎 Öğrenci ismi ara..." oninput="goster()">

  <p id="sayac"></p>
  <ul id="liste"></ul>
</div>

<script>
let ogrenciler = JSON.parse(localStorage.getItem("sinifOgrencileri") || "[]");

function kaydet() {
  localStorage.setItem("sinifOgrencileri", JSON.stringify(ogrenciler));
}

function ekle() {
  const alan = document.getElementById("isim");
  const isim = alan.value.trim();

  if (!isim) {
    alert("Lütfen öğrenci adını yaz.");
    return;
  }
  if (ogrenciler.length >= 16) {
    alert("Sınıf listesi 16 öğrenciyle sınırlıdır.");
    return;
  }

  ogrenciler.push(isim);
  kaydet();
  alan.value = "";
  goster();
}

function goster() {
  const aranan = document.getElementById("arama").value
    .trim().toLocaleLowerCase("tr-TR");

  const liste = document.getElementById("liste");
  liste.innerHTML = "";

  const bulunanlar = ogrenciler
    .map((isim, index) => ({isim, index}))
    .filter(o => o.isim.toLocaleLowerCase("tr-TR").includes(aranan));

  bulunanlar.forEach(o => {
    const li = document.createElement("li");
    li.textContent = o.isim + " ";

    const sil = document.createElement("button");
    sil.textContent = "Sil";
    sil.onclick = () => {
      ogrenciler.splice(o.index, 1);
      kaydet();
      goster();
    };

    li.appendChild(sil);
    liste.appendChild(li);
  });

  document.getElementById("sayac").textContent =
    bulunanlar.length + " sonuç · " + ogrenciler.length + "/16 öğrenci";
}

goster();
</script>
</body>
</html>
